	<div class="container">
		<div class="row add-white-bg align-items-center">
			<div class="col-lg-8 col-md-12">
                <div class="single-contact-box">
                	<div class="contact-contetn">
                		<h4>Write to Us Anytime</h4>
                	</div>
                	<form action="contact.html#">
                		<div class="row">
                			<div class="col-lg-6">
                				<div class="single-input-box">
                					<input type="text" name="name" placeholder="Your Name" required>
                				</div>

                				</div>

                				<div class="single-input-box">
                					<input type="text" name="Phone" placeholder="Phone Number" required>
                				</div>
                			</div>                			
                			<div class="col-lg-6">
                				<div class="single-input-box">
                					<select name="place" id="place">
						               <option value="opel">Web Development </option>
						               <option value="audi">App Development </option>
						               <option value="audi">Graphic Designing</option>
										<option value="audi">Photography</option>
						               <option value="audi">Videography</option>
					                </select>
                				</div>
                			</div>
                			<div class="col-lg-12">
                				<div class="single-input-box">
                					<textarea name="message" id="message" placeholder="Write message" required></textarea>
                				</div>
                			</div>
                			<div class="col-lg-12">
                				<div class="message-sent-button">
                					<button type="submit">Send Message </button>
                				</div>
                			</div>
                		</div>
                	</form>
                </div>
			</div>
			<div class="col-lg-4 col-md-12">
				<div class="single-contact-info-box">
					<div class="info-content">
						<h4>Don’t Forget to Contact Us</h4>
					</div>
					<div class="contact-info-box">
						<div class="contact-info-icon">
							<i class="bi bi-telephone-fill"></i>
						</div>
						<div class="contact-info-content">
							<p>Call Us</p>
							<h4>+234 703 208 4444</h4>
							<h4>+234 703 185 0105</h4>
						</div>
					</div>					
					<div class="contact-info-box">
						<div class="contact-info-icon">

						</div>

						</div>
					</div>					
					<div class="contact-info-box">

						</div>
						<div class="contact-info-content">

							<h4>All Around the Clock</h4>
						</div>
